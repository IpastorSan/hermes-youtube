# Tool configuration only. Hermes reads [project].dependencies as the plugin's
# Python dependencies; keep it empty (youtube-transcript-api ships with Hermes).
[project]
name = "youtube-transcript"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".claude", ".git", ".venv"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
